name: REFFIX Monokai Pro v2.0.1

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate source
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install gettext tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gettext

      - name: Fast source checks
        run: npm run check:fast

      - name: CSS metrics and size budgets
        run: npm run check:mid

      - name: Prepare Playwright
        run: sh tools/ci-playwright.sh

      - name: Browser, accessibility and smoke checks
        run: npm run check:slow

      - name: Build the pinned jsmin checker
        run: echo "JSMIN=$(sh tools/build-jsmin.sh)" >> "$GITHUB_ENV"

      - name: Verify JavaScript survives jsmin
        run: node tools/jsmin-verify.mjs

  build-package:
    name: Build OpenWrt 25.12 APK
    if: "github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.head_commit.message == 'release: v2.0.1'"
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install SDK host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential zstd wget

      - name: Build with the OpenWrt SDK
        env:
          BUILD_DIR: ${{ runner.temp }}/reffix-footstrap-build
          FOOTSTRAP_VERSION: "2.0.1"
          OPENWRT_RELEASE: "25.12.5"
        run: sh luci-theme-footstrap/build-apk.sh

      - name: Collect release APKs and checksums
        shell: bash
        run: |
          set -euo pipefail
          SDK_DIR="$RUNNER_TEMP/reffix-footstrap-build/sdk"
          mkdir -p dist

          THEME_APK="$(find "$SDK_DIR/bin" -type f -name 'luci-theme-footstrap*.apk' -print -quit)"
          test -n "$THEME_APK" || {
            echo "Could not find the built luci-theme-footstrap APK."
            find "$SDK_DIR/bin" -type f -name '*.apk' -print
            exit 1
          }
          cp "$THEME_APK" dist/reffix-luci-theme-footstrap-openwrt-25.12.apk

          while IFS= read -r -d '' PKG; do
            cp "$PKG" "dist/$(basename "$PKG")"
          done < <(find "$SDK_DIR/bin" -type f -name 'luci-i18n-footstrap-*.apk' -print0)

          (cd dist && sha256sum *.apk > SHA256SUMS-openwrt-25.12.txt)
          test -s dist/SHA256SUMS-openwrt-25.12.txt
          echo "Release files:"
          ls -lh dist/

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: reffix-theme-openwrt-25.12
          path: dist/*
          if-no-files-found: error

  publish-release:
    name: Publish v2.0.1
    if: "github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.head_commit.message == 'release: v2.0.1'"
    needs: [validate, build-package]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download built APKs
        uses: actions/download-artifact@v4
        with:
          name: reffix-theme-openwrt-25.12
          path: dist/

      - name: Verify checksums before publishing
        run: |
          set -euo pipefail
          test -s dist/reffix-luci-theme-footstrap-openwrt-25.12.apk
          (cd dist && sha256sum -c SHA256SUMS-openwrt-25.12.txt)

      - name: Publish v2.0.1
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v2.0.1"
          cat > "$RUNNER_TEMP/release-notes.md" <<'EOF'
          # REFFIX Monokai Pro for LuCI v2.0.1

          OpenWrt 25.12 APK package built with the official OpenWrt SDK. No custom package feed is required.

          - The existing package name `luci-theme-footstrap` is retained for in-place upgrades.
          - Separate translation APKs are attached when built.
          - `SHA256SUMS-openwrt-25.12.txt` contains SHA-256 checksums for all APKs.

          Install over SSH:
          `uclient-fetch -qO- https://raw.githubusercontent.com/REFFIX-X/luci-theme-footstrap/main/install-online.sh | sh`

          Matching REFFIX Log Viewer: https://github.com/REFFIX-X/luci-app-log
          EOF

          # Never overwrite a release or tag: a version is published once from its main commit.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || git ls-remote --exit-code origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing release or tag $TAG." >&2
            exit 1
          fi

          gh release create "$TAG" dist/* \
            --target "$GITHUB_SHA" \
            --title "v2.0.1 - REFFIX Monokai Pro for LuCI" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --repo "$GITHUB_REPOSITORY"
